name: Publish staging images (source 22bd2758)
on:
  push:
    branches: [staging-images-22bd2758]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  SOURCE_SHA: 22bd275806ef6f3bccb0c3e7e4a00bfca77460c2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push api/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/executiveusa/montage-api:sha-${{ env.SOURCE_SHA }}
      - name: Build + push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio-web/Dockerfile
          push: true
          tags: ghcr.io/executiveusa/montage-web:sha-${{ env.SOURCE_SHA }}
