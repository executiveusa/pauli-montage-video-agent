name: Phase 11 render gates
on:
 pull_request:
  paths: ['yappy_clipz/**','tests/studio/**','openspec/changes/phase-11-deterministic-render-export/**','.github/workflows/phase11-render-gates.yml']
 push: {branches: ['phase/**']}
permissions: {contents: read}
jobs:
 render:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
     with: {persist-credentials: false}
   - uses: actions/setup-python@v5
     with: {python-version: '3.11'}
   - run: python -m pip install --disable-pip-version-check -r requirements-studio.txt
   - run: python -m py_compile yappy_clipz/*.py
   - run: python -m unittest tests/studio/test_phase11_rendering.py -v
   - run: python -m unittest discover -s tests/studio -p 'test_*.py' -v
