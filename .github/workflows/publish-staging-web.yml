name: Publish staging web image (main c0b365e4d56aac4fab2f2aa2305841ead10cf2bc)
on:
  push:
    branches: [staging-web-main-c0b365e]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  SOURCE_SHA: c0b365e4d56aac4fab2f2aa2305841ead10cf2bc
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push web image (private package, staging only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio-web/Dockerfile
          push: true
          tags: ghcr.io/executiveusa/montage-web:sha-${{ env.SOURCE_SHA }}
