name: Phase 07 persistent API gates

on:
  pull_request:
    paths:
      - 'yappy_clipz/**'
      - 'migrations/**'
      - 'scripts/apply_studio_migrations.py'
      - 'tests/studio/**'
      - 'requirements-studio.txt'
      - 'openspec/changes/phase-07-persistent-authenticated-api/**'
      - '.github/workflows/phase07-api-gates.yml'
  push:
    branches: ['phase/**']

permissions:
  contents: read

jobs:
  persistent-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PHASE07_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_YAPPY_SECRET: ssssssssssssssssssssssssssssssssssssssssssssssss
      TEST_YAPPY_PASSWORD: owner-password
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check -r requirements-studio.txt
      - run: python -m py_compile yappy_clipz/*.py
      - run: python scripts/apply_studio_migrations.py
        env:
          YAPPY_DATABASE_URL: ${{ env.PHASE07_DATABASE_URL }}
      - run: python -m unittest tests/studio/test_phase07_auth_persistence.py -v
      - run: python -m unittest discover -s tests/studio -p 'test_*.py' -v
