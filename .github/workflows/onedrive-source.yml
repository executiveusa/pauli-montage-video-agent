name: Cloud media source safety gates

on:
  pull_request:
    paths:
      - "tools/onedrive_source.py"
      - "tools/composio_onedrive.py"
      - "tools/lmstudio_sage.py"
      - "yappy_clipz/onedrive_actions.py"
      - "yappy_clipz/factory.py"
      - "scripts/onedrive_footage.py"
      - "tests/test_onedrive_cli_source.py"
      - "tests/test_composio_onedrive.py"
      - "tests/test_lmstudio_sage.py"
      - "requirements.txt"
      - ".agents/skills/onedrive-footage/**"
      - ".agents/skills/sage-local-editor/**"
      - "apps/studio-web/app/media/**"
      - "apps/studio-web/app/api/media/**"
      - "apps/studio-web/lib/composio-cloud-media.ts"
      - "apps/studio-web/lib/media-registry.ts"
      - "supabase/migrations/**"
      - ".github/workflows/onedrive-source.yml"
  push:
    branches: [main]
    paths:
      - "tools/onedrive_source.py"
      - "tools/composio_onedrive.py"
      - "tools/lmstudio_sage.py"
      - "yappy_clipz/onedrive_actions.py"
      - "yappy_clipz/factory.py"
      - "scripts/onedrive_footage.py"
      - "tests/test_onedrive_cli_source.py"
      - "tests/test_composio_onedrive.py"
      - "tests/test_lmstudio_sage.py"
      - "requirements.txt"
      - ".agents/skills/onedrive-footage/**"
      - ".agents/skills/sage-local-editor/**"
      - "apps/studio-web/app/media/**"
      - "apps/studio-web/app/api/media/**"
      - "apps/studio-web/lib/composio-cloud-media.ts"
      - "apps/studio-web/lib/media-registry.ts"
      - "supabase/migrations/**"
      - ".github/workflows/onedrive-source.yml"

jobs:
  cloud-media-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run protected-source and Sage tests
        run: python -m pytest tests/test_onedrive_cli_source.py tests/test_composio_onedrive.py tests/test_lmstudio_sage.py -q
      - name: Compile Python source boundary
        run: |
          python -m py_compile \
            tools/onedrive_source.py \
            tools/composio_onedrive.py \
            tools/lmstudio_sage.py \
            yappy_clipz/onedrive_actions.py \
            yappy_clipz/factory.py \
            scripts/onedrive_footage.py \
            tests/test_onedrive_cli_source.py \
            tests/test_composio_onedrive.py \
            tests/test_lmstudio_sage.py
      - name: Install Studio dependencies
        working-directory: apps/studio-web
        run: npm ci
      - name: Typecheck Studio media library
        working-directory: apps/studio-web
        run: npm run typecheck
      - name: Build Studio media library
        working-directory: apps/studio-web
        run: npm run build
