name: PR40 critic hardening patch

on:
  push:
    branches:
      - fix/local-engine-onboarding
    paths:
      - scripts/pr40_hardening_patch.py
      - .github/workflows/pr40-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic branch patch
        run: python scripts/pr40_hardening_patch.py
      - name: Reconcile package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Sanity-check patched sources
        run: |
          git diff --check
          python -m py_compile scripts/pr40_hardening_patch.py tools/local_footage.py tests/studio_browser_acceptance.py tests/test_local_footage.py
      - name: Commit branch-only hardening
        run: |
          git config user.name "Agenix Governor"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/studio-web/components/FootageWorkbench.tsx \
            apps/studio-web/components/TimelineEditor.tsx \
            apps/studio-web/lib/local-engine.ts \
            apps/studio-web/lib/local-review-render.ts \
            apps/studio-web/lib/local-studio-store.ts \
            tools/local_footage.py \
            tests/studio_browser_acceptance.py \
            tests/test_local_footage.py \
            docs/evidence/ASC3ND-WHY-WE-STARTED-MONTAGE-DOD.md \
            package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "fix: resolve PR40 critic findings"
          git push origin HEAD:fix/local-engine-onboarding
