name: Local footage factory gates

on:
  pull_request:
    paths:
      - "tools/local_footage.py"
      - "tools/synthcut_adapter.py"
      - "scripts/montage_local_service.py"
      - "scripts/prewarm_whisper.py"
      - "scripts/setup_montage_windows.ps1"
      - "scripts/start_montage_windows.ps1"
      - "tests/test_local_footage.py"
      - "tests/test_windows_onboarding.py"
      - "docs/ASC3ND_LOCAL_FOOTAGE_QUICKSTART.md"
      - "apps/studio-web/**"
      - ".github/workflows/local-footage.yml"
  push:
    branches: [main]
    paths:
      - "tools/local_footage.py"
      - "tools/synthcut_adapter.py"
      - "scripts/montage_local_service.py"
      - "scripts/prewarm_whisper.py"
      - "scripts/setup_montage_windows.ps1"
      - "scripts/start_montage_windows.ps1"
      - "tests/test_local_footage.py"
      - "tests/test_windows_onboarding.py"
      - "docs/ASC3ND_LOCAL_FOOTAGE_QUICKSTART.md"
      - "apps/studio-web/**"
      - ".github/workflows/local-footage.yml"

jobs:
  local-footage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python contract dependencies
        run: python -m pip install -r requirements.txt
      - name: Run local footage contract tests
        run: python -m unittest tests.test_local_footage tests.test_windows_onboarding -v
      - name: Compile local worker and tools
        run: python -m py_compile tools/local_footage.py tools/synthcut_adapter.py scripts/montage_local_service.py scripts/prewarm_whisper.py
      - name: Parse Windows PowerShell onboarding scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('scripts/setup_montage_windows.ps1', 'scripts/start_montage_windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Install Studio dependencies
        run: npm install
      - name: Typecheck Studio
        run: npm run typecheck:studio
      - name: Build Studio
        run: npm run build:studio
