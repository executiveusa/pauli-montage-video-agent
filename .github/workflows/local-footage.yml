name: Local footage factory gates

on:
  pull_request:
    paths:
      - "tools/local_footage.py"
      - "tools/synthcut_adapter.py"
      - "scripts/montage_local_service.py"
      - "tests/test_local_footage.py"
      - "apps/studio-web/**"
      - ".github/workflows/local-footage.yml"
  push:
    branches: [main]
    paths:
      - "tools/local_footage.py"
      - "tools/synthcut_adapter.py"
      - "scripts/montage_local_service.py"
      - "tests/test_local_footage.py"
      - "apps/studio-web/**"

jobs:
  local-footage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python contract dependencies
        run: python -m pip install -r requirements.txt
      - name: Run local footage contract tests
        run: python -m unittest tests.test_local_footage -v
      - name: Compile local worker and tools
        run: python -m py_compile tools/local_footage.py tools/synthcut_adapter.py scripts/montage_local_service.py
      - name: Install Studio dependencies
        run: npm install
      - name: Typecheck Studio
        run: npm run typecheck:studio
      - name: Build Studio
        run: npm run build:studio
