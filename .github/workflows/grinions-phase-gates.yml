name: GRINIONS phase gates

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'ops/grinions/**'
      - 'openspec/**'
      - '.ralphy/**'
      - '.github/workflows/grinions-phase-gates.yml'
      - '.github/pull_request_template.md'
      - 'EMERALD_TABLETS.md'
      - 'icm/**'
      - 'packages/contracts/**'
      - 'yappy_clipz/**'
      - 'tests/studio/**'
      - 'requirements-studio.txt'
      - 'apps/studio-web/**'
      - 'package.json'
      - 'vercel.json'
  push:
    branches:
      - 'phase/**'
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'ops/grinions/**'
      - 'openspec/**'
      - '.ralphy/**'
      - '.github/workflows/grinions-phase-gates.yml'
      - '.github/pull_request_template.md'
      - 'EMERALD_TABLETS.md'
      - 'icm/**'
      - 'packages/contracts/**'
      - 'yappy_clipz/**'
      - 'tests/studio/**'
      - 'requirements-studio.txt'
      - 'apps/studio-web/**'
      - 'package.json'
      - 'vercel.json'

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      ABSURD_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      BEADS_VERSION: 1.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenSpec
        run: |
          npm install -g @fission-ai/openspec@1.3.1
          openspec --version

      - name: Install deployed web dependency set
        run: |
          npm install --omit=optional
          npm install --no-save @next/swc-linux-x64-gnu@16.2.11

      - name: Audit deployed production web dependencies
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Typecheck YAPPY-CLIPZ studio web
        run: npm run typecheck:studio

      - name: Build YAPPY-CLIPZ studio web
        run: npm run build:studio

      - name: Download pinned Beads release and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          BEADS_TAG="v${BEADS_VERSION}"
          BEADS_ARCHIVE="beads_${BEADS_VERSION}_linux_amd64.tar.gz"
          BEADS_BASE="https://github.com/gastownhall/beads/releases/download/${BEADS_TAG}"
          curl -fsSL "${BEADS_BASE}/${BEADS_ARCHIVE}" -o "/tmp/${BEADS_ARCHIVE}"
          curl -fsSL "${BEADS_BASE}/checksums.txt" -o /tmp/beads-checksums.txt
          echo "BEADS_ARCHIVE=$BEADS_ARCHIVE" >> "$GITHUB_ENV"

      - name: Verify pinned Beads release checksum
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(awk -v target="$BEADS_ARCHIVE" '{name=$2; sub(/^\*/, "", name); if (name == target) {print $1; exit}}' /tmp/beads-checksums.txt)"
          test -n "$EXPECTED"
          ACTUAL="$(sha256sum "/tmp/${BEADS_ARCHIVE}" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"

      - name: Install verified Beads native binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/beads-extract
          mkdir -p /tmp/beads-extract "$RUNNER_TEMP/bin"
          tar -xzf "/tmp/${BEADS_ARCHIVE}" -C /tmp/beads-extract
          BD_SOURCE="$(find /tmp/beads-extract -maxdepth 2 -type f -name bd -perm -u+x | head -n 1)"
          test -n "$BD_SOURCE"
          install -m 0755 "$BD_SOURCE" "$RUNNER_TEMP/bin/bd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "BD_BIN=$RUNNER_TEMP/bin/bd" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bin/bd" version

      - name: Validate all active OpenSpec changes strictly
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for change_dir in openspec/changes/*; do
            [ -d "$change_dir" ] || continue
            change="$(basename "$change_dir")"
            [ "$change" = "archive" ] && continue
            openspec validate "$change" --strict --no-interactive
            found=1
          done
          test "$found" -eq 1

      - name: Verify Beads agent bootstrap contract
        run: |
          export BEADS_DIR="$RUNNER_TEMP/yappy-clipz-beads"
          "$BD_BIN" init --quiet --stealth
          "$BD_BIN" prime >/tmp/bd-prime.txt
          "$BD_BIN" ready --json >/tmp/bd-ready.json
          test -s /tmp/bd-prime.txt
          test -s /tmp/bd-ready.json

      - name: Install control-plane dependencies
        run: npm install --prefix ops/grinions --ignore-scripts

      - name: Install Studio/API/MCP dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-studio.txt

      - name: StudioProject v1 contract tests
        run: |
          python packages/contracts/validate_contracts.py
          python packages/contracts/test_contracts.py

      - name: ICM workspace safety tests
        run: python icm/test_workspace.py

      - name: Shared StudioService CLI/API/MCP parity tests
        run: python -m unittest discover -s tests/studio -p 'test_*.py' -v

      - name: Install uv and initialize Absurd
        run: |
          python -m pip install --disable-pip-version-check uv
          uvx absurdctl init -d "$ABSURD_DATABASE_URL"
          uvx absurdctl create-queue -d "$ABSURD_DATABASE_URL" grinions_test

      - name: Unit, restart, and Absurd/Postgres idempotency tests
        run: npm test --prefix ops/grinions

      - name: Deterministic structure gate from package working directory
        run: npm run verify --prefix ops/grinions
