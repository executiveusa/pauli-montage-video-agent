name: GRINIONS phase gates

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'ops/grinions/**'
      - 'openspec/**'
      - '.ralphy/**'
      - '.github/workflows/grinions-phase-gates.yml'
      - '.github/pull_request_template.md'
      - 'EMERALD_TABLETS.md'
      - 'icm/**'
  push:
    branches:
      - 'phase/**'
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'ops/grinions/**'
      - 'openspec/**'
      - '.ralphy/**'
      - '.github/workflows/grinions-phase-gates.yml'
      - '.github/pull_request_template.md'
      - 'EMERALD_TABLETS.md'
      - 'icm/**'

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      ABSURD_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      BEADS_VERSION: 1.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenSpec
        run: |
          npm install -g @fission-ai/openspec@1.3.1
          openspec --version

      - name: Resolve pinned Beads registry metadata
        shell: bash
        run: |
          set -euo pipefail
          TARBALL_URL="$(npm view "@beads/bd@${BEADS_VERSION}" dist.tarball)"
          EXPECTED="$(npm view "@beads/bd@${BEADS_VERSION}" dist.integrity)"
          test -n "$TARBALL_URL"
          test -n "$EXPECTED"
          echo "BEADS_TARBALL_URL=$TARBALL_URL" >> "$GITHUB_ENV"
          echo "BEADS_EXPECTED_INTEGRITY=$EXPECTED" >> "$GITHUB_ENV"

      - name: Download and verify pinned Beads tarball
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$BEADS_TARBALL_URL" -o /tmp/beads-bd.tgz
          ACTUAL="sha512-$(openssl dgst -sha512 -binary /tmp/beads-bd.tgz | openssl base64 -A)"
          test "$BEADS_EXPECTED_INTEGRITY" = "$ACTUAL"

      - name: Install verified Beads tarball
        run: npm install -g /tmp/beads-bd.tgz

      - name: Verify pinned Beads binary
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/beads-bd.tgz
          BD_BIN="$(command -v bd)"
          test -x "$BD_BIN"
          echo "BD_BIN=$BD_BIN" >> "$GITHUB_ENV"
          "$BD_BIN" version

      - name: Validate all active OpenSpec changes strictly
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for change_dir in openspec/changes/*; do
            [ -d "$change_dir" ] || continue
            change="$(basename "$change_dir")"
            [ "$change" = "archive" ] && continue
            openspec validate "$change" --strict --no-interactive
            found=1
          done
          test "$found" -eq 1

      - name: Verify Beads agent bootstrap contract
        run: |
          export BEADS_DIR="$RUNNER_TEMP/yappy-clipz-beads"
          "$BD_BIN" init --quiet --stealth
          "$BD_BIN" prime >/tmp/bd-prime.txt
          "$BD_BIN" ready --json >/tmp/bd-ready.json
          test -s /tmp/bd-prime.txt
          test -s /tmp/bd-ready.json

      - name: Install control-plane dependencies
        run: npm install --prefix ops/grinions --ignore-scripts

      - name: Install uv and initialize Absurd
        run: |
          python -m pip install --disable-pip-version-check uv
          uvx absurdctl init -d "$ABSURD_DATABASE_URL"
          uvx absurdctl create-queue -d "$ABSURD_DATABASE_URL" grinions_test

      - name: Unit, restart, and Absurd/Postgres idempotency tests
        run: npm test --prefix ops/grinions

      - name: Deterministic structure gate from package working directory
        run: npm run verify --prefix ops/grinions
