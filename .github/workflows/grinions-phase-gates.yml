name: GRINIONS phase gates

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'ops/grinions/**'
      - 'ops/upgrade/**'
      - 'openspec/**'
      - '.ralphy/**'
      - '.github/workflows/grinions-phase-gates.yml'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - 'EMERALD_TABLETS.md'
      - 'icm/**'
      - 'packages/contracts/**'
      - 'yappy_clipz/**'
      - 'tests/studio/**'
      - 'scripts/render_upgrade_progress.py'
      - 'scripts/validate_active_openspecs.py'
      - 'docs/adr/**'
      - 'docs/SOURCE-LICENSE-REGISTER.md'
      - 'docs/UPGRADE-PARITY-MAP.md'
      - 'docs/YAPPY-UPGRADE-PROGRESS.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/CURRENT-STATE.md'
      - 'docs/YAPPY-CLIPZ-MASTER-PLAN.md'
      - 'docs/YAPPY-CLIPZ-VOICE-CLOUD-STUDIO-PRD.md'
      - 'requirements-studio.txt'
      - 'requirements.txt'
      - 'apps/studio-web/**'
      - 'package.json'
      - 'vercel.json'
  push:
    branches:
      - 'phase/**'
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'ops/grinions/**'
      - 'ops/upgrade/**'
      - 'openspec/**'
      - '.ralphy/**'
      - '.github/workflows/grinions-phase-gates.yml'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - 'EMERALD_TABLETS.md'
      - 'icm/**'
      - 'packages/contracts/**'
      - 'yappy_clipz/**'
      - 'tests/studio/**'
      - 'scripts/render_upgrade_progress.py'
      - 'scripts/validate_active_openspecs.py'
      - 'docs/adr/**'
      - 'docs/SOURCE-LICENSE-REGISTER.md'
      - 'docs/UPGRADE-PARITY-MAP.md'
      - 'docs/YAPPY-UPGRADE-PROGRESS.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/CURRENT-STATE.md'
      - 'docs/YAPPY-CLIPZ-MASTER-PLAN.md'
      - 'docs/YAPPY-CLIPZ-VOICE-CLOUD-STUDIO-PRD.md'
      - 'requirements-studio.txt'
      - 'requirements.txt'
      - 'apps/studio-web/**'
      - 'package.json'
      - 'vercel.json'

permissions:
  actions: read
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      ABSURD_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      BEADS_VERSION: 1.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenSpec
        run: |
          npm install -g @fission-ai/openspec@1.3.1
          openspec --version

      - name: Install deployed web dependency set
        run: |
          npm install --omit=optional
          npm install --no-save @next/swc-linux-x64-gnu@16.2.11

      - name: Capture deployed production web dependency audit
        id: deployed_audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --omit=optional --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python - "$RUNNER_TEMP/npm-audit.json" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          metadata = report.get("metadata", {}).get("vulnerabilities", {})
          print("deployed audit counts:", json.dumps(metadata, sort_keys=True))
          for name, finding in sorted(report.get("vulnerabilities", {}).items()):
              if finding.get("severity") not in {"high", "critical"}:
                  continue
              print(json.dumps({
                  "package": name,
                  "severity": finding.get("severity"),
                  "range": finding.get("range"),
                  "via": finding.get("via"),
                  "effects": finding.get("effects"),
                  "fixAvailable": finding.get("fixAvailable"),
              }, sort_keys=True))
          PY
          exit 0

      - name: Upload deployed dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-npm-audit-${{ github.sha }}
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Gate deployed production web dependencies
        if: always()
        shell: bash
        run: test "${{ steps.deployed_audit.outputs.status }}" -eq 0

      - name: Typecheck YAPPY-CLIPZ studio web
        run: npm run typecheck:studio

      - name: Build YAPPY-CLIPZ studio web
        run: npm run build:studio

      - name: Download pinned Beads release and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          BEADS_TAG="v${BEADS_VERSION}"
          BEADS_ARCHIVE="beads_${BEADS_VERSION}_linux_amd64.tar.gz"
          BEADS_BASE="https://github.com/gastownhall/beads/releases/download/${BEADS_TAG}"
          curl -fsSL "${BEADS_BASE}/${BEADS_ARCHIVE}" -o "/tmp/${BEADS_ARCHIVE}"
          curl -fsSL "${BEADS_BASE}/checksums.txt" -o /tmp/beads-checksums.txt
          echo "BEADS_ARCHIVE=$BEADS_ARCHIVE" >> "$GITHUB_ENV"

      - name: Verify pinned Beads release checksum
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(awk -v target="$BEADS_ARCHIVE" '{name=$2; sub(/^\*/, "", name); if (name == target) {print $1; exit}}' /tmp/beads-checksums.txt)"
          test -n "$EXPECTED"
          ACTUAL="$(sha256sum "/tmp/${BEADS_ARCHIVE}" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"

      - name: Install verified Beads native binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/beads-extract
          mkdir -p /tmp/beads-extract "$RUNNER_TEMP/bin"
          tar -xzf "/tmp/${BEADS_ARCHIVE}" -C /tmp/beads-extract
          BD_SOURCE="$(find /tmp/beads-extract -maxdepth 2 -type f -name bd -perm -u+x | head -n 1)"
          test -n "$BD_SOURCE"
          install -m 0755 "$BD_SOURCE" "$RUNNER_TEMP/bin/bd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "BD_BIN=$RUNNER_TEMP/bin/bd" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bin/bd" version

      - name: Validate all active OpenSpec changes strictly
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for change_dir in openspec/changes/*; do
            [ -d "$change_dir" ] || continue
            change="$(basename "$change_dir")"
            [ "$change" = "archive" ] && continue
            openspec validate "$change" --strict --no-interactive
            found=1
          done
          test "$found" -eq 1

      - name: Verify Beads agent bootstrap contract
        run: |
          export BEADS_DIR="$RUNNER_TEMP/yappy-clipz-beads"
          "$BD_BIN" init --quiet --stealth
          "$BD_BIN" prime >/tmp/bd-prime.txt
          "$BD_BIN" ready --json >/tmp/bd-ready.json
          test -s /tmp/bd-prime.txt
          test -s /tmp/bd-ready.json

      - name: Install control-plane dependencies
        run: npm install --prefix ops/grinions --ignore-scripts

      - name: Install Studio/API/MCP dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-studio.txt

      - name: StudioProject v1 contract tests
        run: |
          python packages/contracts/validate_contracts.py
          python packages/contracts/test_contracts.py

      - name: ICM workspace safety tests
        run: python icm/test_workspace.py

      - name: Shared StudioService CLI/API/MCP parity tests
        run: python -m unittest discover -s tests/studio -p 'test_*.py' -v

      - name: Verify canonical upgrade evidence against GitHub and origin/main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YAPPY_VERIFY_CANONICAL_REMOTE: '1'
        run: python scripts/render_upgrade_progress.py --check

      - name: Install uv and initialize Absurd
        run: |
          python -m pip install --disable-pip-version-check uv
          uvx absurdctl init -d "$ABSURD_DATABASE_URL"
          uvx absurdctl create-queue -d "$ABSURD_DATABASE_URL" grinions_test

      - name: Unit, restart, and Absurd/Postgres idempotency tests
        run: npm test --prefix ops/grinions

      - name: Deterministic structure gate from package working directory
        run: npm run verify --prefix ops/grinions
