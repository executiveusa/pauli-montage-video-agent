name: GRINIONS phase gates

on:
  pull_request:
    paths:
      - 'ops/grinions/**'
      - 'openspec/**'
      - '.ralphy/**'
      - '.github/workflows/grinions-phase-gates.yml'
  push:
    branches:
      - 'phase/**'
    paths:
      - 'ops/grinions/**'
      - 'openspec/**'
      - '.ralphy/**'
      - '.github/workflows/grinions-phase-gates.yml'

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      ABSURD_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install control-plane dependencies
        run: npm install --prefix ops/grinions --ignore-scripts

      - name: Install uv and initialize Absurd
        run: |
          python -m pip install --disable-pip-version-check uv
          uvx absurdctl init -d "$ABSURD_DATABASE_URL"
          uvx absurdctl create-queue -d "$ABSURD_DATABASE_URL" grinions_test

      - name: Unit and restart/idempotency tests
        run: npm test --prefix ops/grinions

      - name: Deterministic structure gate
        run: node ops/grinions/scripts/verify.mjs
