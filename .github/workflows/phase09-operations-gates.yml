name: Phase 09 operations gates
on:
 pull_request:
  paths: ['yappy_clipz/**','migrations/**','tests/studio/**','openspec/changes/phase-09-jobs-approvals-costs-omnirouter/**','.github/workflows/phase09-operations-gates.yml']
 push: {branches: ['phase/**']}
permissions: {contents: read}
jobs:
 operations:
  runs-on: ubuntu-latest
  services:
   postgres:
    image: postgres:16
    env: {POSTGRES_PASSWORD: postgres}
    ports: ['5432:5432']
    options: >-
     --health-cmd="pg_isready -U postgres"
     --health-interval=5s
     --health-timeout=5s
     --health-retries=10
  env: {PHASE09_DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/postgres'}
  steps:
   - uses: actions/checkout@v4
     with: {persist-credentials: false}
   - uses: actions/setup-python@v5
     with: {python-version: '3.11'}
   - run: python -m pip install --disable-pip-version-check -r requirements-studio.txt
   - run: python -m py_compile yappy_clipz/*.py
   - run: python -m unittest tests/studio/test_phase09_operations.py -v
   - run: python -m unittest discover -s tests/studio -p 'test_*.py' -v
