name: Phase 06 interoperability gates

on:
  pull_request:
    paths:
      - 'prompt_locker/**'
      - 'providers/**'
      - 'packages/contracts/actions/**'
      - 'packages/contracts/icm/**'
      - 'packages/contracts/snapshots/**'
      - 'yappy_clipz/**'
      - 'tests/studio/**'
      - 'icm/**'
      - 'openspec/changes/phase-06-interoperability-icm-foundation/**'
      - 'requirements-studio.txt'
      - '.github/workflows/phase06-interoperability-gates.yml'
  push:
    branches:
      - 'phase/**'
    paths:
      - 'prompt_locker/**'
      - 'providers/**'
      - 'packages/contracts/actions/**'
      - 'packages/contracts/icm/**'
      - 'packages/contracts/snapshots/**'
      - 'yappy_clipz/**'
      - 'tests/studio/**'
      - 'icm/**'
      - 'openspec/changes/phase-06-interoperability-icm-foundation/**'
      - 'requirements-studio.txt'
      - '.github/workflows/phase06-interoperability-gates.yml'

permissions:
  contents: read

jobs:
  interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YAPPY_ENABLE_PAID_PROVIDERS: '0'
      YAPPY_FAL_STORE_IO: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Studio dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-studio.txt

      - name: Compile application modules
        run: python -m py_compile yappy_clipz/*.py yappy_clipz/providers/*.py

      - name: Verify paid execution is disabled by default
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from yappy_clipz.settings import Settings
          from yappy_clipz.providers import ProviderCatalog

          settings = Settings.from_env()
          assert settings.fal_execution_enabled is False
          manifest = ProviderCatalog(Path('providers')).get('fal')
          assert manifest['executionEnabledByDefault'] is False
          assert 'FAL_KEY' not in json.dumps(manifest)
          PY

      - name: Run Phase 06 contract and adapter tests
        run: python -m unittest tests/studio/test_phase06_foundation.py tests/studio/test_dispatcher_local.py -v

      - name: Run full Studio compatibility suite
        run: python -m unittest discover -s tests/studio -p 'test_*.py' -v
