name: Phase 08 asset gates
on:
  pull_request:
    paths: ['yappy_clipz/**','tests/studio/**','requirements-studio.txt','openspec/changes/phase-08-asset-registry-provenance/**','.github/workflows/phase08-asset-gates.yml']
  push:
    branches: ['phase/**']
permissions: {contents: read}
jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TEST_STORAGE_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check -r requirements-studio.txt
      - run: python -m py_compile yappy_clipz/*.py
      - run: python -m unittest tests/studio/test_phase08_assets.py -v
      - run: python -m unittest discover -s tests/studio -p 'test_*.py' -v
