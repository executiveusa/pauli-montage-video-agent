project:
  name: yappy-clipz
  language: Python and TypeScript
  framework: FastAPI and Next.js
  description: YAPPY-CLIPZ canonical video-production studio

commands:
  test: "npm test --prefix ops/grinions && python packages/contracts/validate_contracts.py && python packages/contracts/test_contracts.py && python icm/test_workspace.py && python -m unittest discover -s tests/studio -p 'test_*.py' -v"
  lint: "python scripts/render_upgrade_progress.py --check"
  build: "python scripts/validate_active_openspecs.py && npm run typecheck:studio && npm run build:studio"

boundaries:
  never_touch:
    - ".env*"
    - "ops/upgrade/evidence/**/*.json"
    - "docs/YAPPY-UPGRADE-PROGRESS.md"
    - ".ralphy/progress.txt"
    - "package-lock.json"

rules:
  - Read AGENTS.md, AGENT_GUIDE.md, the active OpenSpec change, and the claimed Bead before editing.
  - Work on one bounded Bead at a time.
  - Never merge main, create production deployments, modify secrets, or weaken required checks.
  - Do not change accepted requirements without a recorded OpenSpec change.
  - Run tests and lint; never use fast/no-tests/no-lint modes in GRINIONS execution.
  - Record discoveries as new linked Beads rather than expanding scope silently.
  - Treat ops/upgrade/roadmap.json as the only upgrade task authority; evidence and progress are generated or verified by repository tooling.
  - Ralphy runtime safety is enforced by ops/grinions/src/ralphy.mjs CLI arguments, not by unsupported YAML keys.
